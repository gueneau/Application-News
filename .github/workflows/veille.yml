name: Veille Environnementale ABC

on:
  # No `schedule:` trigger here on purpose — GitHub Actions' own cron was
  # observed dropping the large majority of its ticks on this repo (see
  # commit history / README). The reliable 8h/14h Paris trigger now lives
  # in Supabase (pg_cron + pg_net calling workflow_dispatch below), which
  # also handles CET/CEST automatically via Postgres's timezone database.
  # See supabase/migrations/007_veille_cron_trigger.sql.
  workflow_dispatch:         # déclenchement manuel depuis l'onglet Actions, et cible du cron Supabase

permissions:
  contents: write            # nécessaire pour le push gh-pages

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout branche main ──────────────────────────────────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # historique complet pour le push gh-pages

      # ── 2. Python ────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Dépendances ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # ── 4. Checkout gh-pages (réutilisé à l'étape 6 pour le commit) ──
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch

      # ── 4bis. Restauration de l'état du jour depuis gh-pages ─────
      #    data/<date>.json : permet au run de l'après-midi de reprendre
      #    tel quel ce que le run du matin a déjà retenu (cohérence
      #    intraday), plutôt que de tout redériver depuis zéro.
      #    rss_seen.json : cache de dédoublonnage des sources fallback_crawl,
      #    ne sert à rien s'il repart de zéro à chaque run.
      - name: Restore today's data from gh-pages
        run: |
          mkdir -p data
          TODAY=$(date -u +%Y-%m-%d)
          cp "gh-pages-branch/data/${TODAY}.json" "data/${TODAY}.json" 2>/dev/null || true
          cp gh-pages-branch/data/rss_seen.json data/rss_seen.json 2>/dev/null || true

      # ── 5. Exécution du pipeline ─────────────────────────────────
      - name: Run pipeline
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY:   ${{ secrets.MISTRAL_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python -m abc_pipeline.main

      # ── 6. Copie des fichiers générés vers gh-pages ──────────────
      - name: Copy generated files to gh-pages
        run: |
          # Créer le dossier data s'il n'existe pas
          mkdir -p gh-pages-branch/data

          # Copier le JSON du jour
          cp data/*.json gh-pages-branch/data/ 2>/dev/null || true

          # Copier archive.json à la racine de gh-pages
          cp archive.json gh-pages-branch/archive.json

          # Copier l'historique VigiEau (cache annuel)
          cp vigieau_history.json gh-pages-branch/vigieau_history.json 2>/dev/null || true

          # Copier index.html si modifié
          cp index.html gh-pages-branch/index.html
          cp site.webmanifest gh-pages-branch/site.webmanifest
          mkdir -p gh-pages-branch/assets
          cp assets/app-icon.svg assets/app-icon-192.png assets/app-icon-512.png assets/apple-touch-icon.png gh-pages-branch/assets/

      # ── 7. Commit et push vers gh-pages ──────────────────────────
      - name: Commit and push to gh-pages
        run: |
          cd gh-pages-branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Commit seulement s'il y a des changements
          git diff --staged --quiet || git commit -m "data: veille $(date -u +%Y-%m-%d)"
          git push origin gh-pages
